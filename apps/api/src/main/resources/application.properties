# Local dev: load secrets from apps/api/.env if present (path is relative to
# the directory the app starts in). In production the real environment is used.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/findos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only verifies entities match the tables.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.config.import=optional:file:.env[.properties]
